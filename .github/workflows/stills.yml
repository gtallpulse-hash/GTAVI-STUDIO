name: Stills

# Haalt stills uit officiële GTA VI-video's van Rockstar (zie studio/stills.py) en zet ze op de branch 'stills'.
# De scheduled task kiest er wekelijks de beste uit en zet ze via Make in de mediabibliotheek.
on:
  schedule:
    - cron: "17 2 * * 1"   # maandag ±03:17 Belgische tijd
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra YouTube-ID's van Rockstar-video's (spatie ertussen), optioneel"
        required: false

permissions:
  contents: write

concurrency:
  group: stills
  cancel-in-progress: false

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereedschap installeren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U yt-dlp pillow

      - name: Diagnose downloadroutes
        if: github.event.inputs.extra == 'probe'
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python -u studio/stills_probe.py
          exit 1

      - name: Bestaande stills ophalen
        run: |
          mkdir -p /tmp/stills
          if git ls-remote --exit-code --heads origin stills > /dev/null; then
            git fetch -q --depth 1 origin stills
            git archive origin/stills | tar -x -C /tmp/stills
          fi

      - name: Stills maken
        run: python -u studio/stills.py /tmp/stills ${{ github.event.inputs.extra }}

      - name: Op branch 'stills' zetten
        if: always()
        run: |
          cd /tmp/stills
          [ -f catalogus.json ] || { echo "Niets te bewaren"; exit 0; }
          git init -q -b stills
          git add -A
          git -c user.name="gtavi-studio-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Stills $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stills
          echo "Catalogus: https://raw.githubusercontent.com/${{ github.repository }}/stills/catalogus.json"
