name: Render Shorts

on:
  push:
    branches: [main]
    paths: ["jobs/*.json"]
  schedule:
    # Elke 10 minuten tussen 06:00 en 10:00 (Belgische wintertijd): haalt de opdracht op
    # die de scheduled task via Make op gta6centraal.com zette (renderopdracht-<datum>.txt)
    - cron: "*/10 5-8 * * *"
  workflow_dispatch:
    inputs:
      datum:
        description: "Datum van een opdracht in jobs/ (bv. 2026-10-30)"
        required: false
      van_site:
        description: "Of: datum van een opdracht die op de site staat (renderopdracht-<datum>)"
        required: false
      alleen_ophalen:
        description: "ja = alleen ophalen en tonen (test), niet renderen"
        required: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Welke opdracht?
        id: job
        run: |
          f=""
          if [ -n "${{ github.event.inputs.datum }}" ]; then
            f="jobs/${{ github.event.inputs.datum }}.json"
          elif [ "${{ github.event_name }}" = "push" ]; then
            f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' | sort | tail -1)
          elif [ "${{ github.event_name }}" = "schedule" ] || [ -n "${{ github.event.inputs.van_site }}" ]; then
            d="${{ github.event.inputs.van_site }}"
            [ -z "$d" ] && d=$(TZ=Europe/Brussels date +%F)
            if [ "${{ github.event_name }}" = "schedule" ] && git ls-remote --exit-code --heads origin media > /dev/null; then
              git fetch -q --depth 1 origin media
              if git cat-file -e "origin/media:$d/manifest.json" 2>/dev/null; then
                echo "Media van $d staan er al, niets te doen."
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
            if [ ! -f "jobs/$d.json" ] || [ -n "${{ github.event.inputs.van_site }}" ]; then
              set +e; python3 studio/haal_opdracht.py "$d" "jobs/$d.json"; rc=$?; set -e
              if [ $rc -ne 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              cat "jobs/$d.json"; echo "::notice::$(python3 -c "import json;j=json.load(open('jobs/$d.json'));print(j['reels'][0]['titel'])")"
              echo "nieuw=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ github.event.inputs.alleen_ophalen }}" = "ja" ]; then
              echo "Alleen ophalen (test): klaar."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            f="jobs/$d.json"
          fi
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "Geen nieuwe opdracht, niets te doen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bestand=$f" >> "$GITHUB_OUTPUT"
          echo "datum=$(basename "$f" .json)" >> "$GITHUB_OUTPUT"
          echo "Opdracht: $f"

      - uses: actions/setup-python@v5
        if: steps.job.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Gereedschap installeren
        if: steps.job.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          npm install --no-save --silent @fontsource/bebas-neue @fontsource/inter

      - name: Dia's en video's maken
        if: steps.job.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "out/${{ steps.job.outputs.datum }}"
          python -u studio/render.py "${{ steps.job.outputs.bestand }}" out 2>&1 | tee "out/${{ steps.job.outputs.datum }}/log.txt"

      - name: Foutmelding klaarzetten
        if: failure() && steps.job.outputs.skip != 'true'
        run: |
          mkdir -p "out/${{ steps.job.outputs.datum }}"
          echo '{"datum":"${{ steps.job.outputs.datum }}","fout":"Renderen mislukt, zie ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' > "out/${{ steps.job.outputs.datum }}/fout.json"

      - name: Op branch 'media' zetten (laatste 10 dagen)
        if: always() && steps.job.outputs.skip != 'true'
        run: |
          set -e
          git config user.name "gtavi-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/media
          if git ls-remote --exit-code --heads origin media > /dev/null; then
            git fetch -q --depth 1 origin media
            git archive origin/media | tar -x -C /tmp/media
          fi
          rm -rf "/tmp/media/${{ steps.job.outputs.datum }}"
          cp -r "out/${{ steps.job.outputs.datum }}" /tmp/media/
          grens=$(date -u -d "10 days ago" +%Y-%m-%d)
          for d in /tmp/media/20*; do [ -d "$d" ] && [ "$(basename "$d")" \< "$grens" ] && rm -rf "$d"; done
          cd /tmp/media
          git init -q -b media
          git add -A
          git -c user.name="gtavi-studio-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Media ${{ steps.job.outputs.datum }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          echo "Klaar: https://raw.githubusercontent.com/${{ github.repository }}/media/${{ steps.job.outputs.datum }}/manifest.json"

      - name: Opdracht bewaren in jobs/ (logboek)
        if: success() && steps.job.outputs.nieuw == 'true' && steps.job.outputs.skip != 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gtavi-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.job.outputs.bestand }}"
          git commit -q -m "Renderopdracht ${{ steps.job.outputs.datum }} (van de site) [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main || echo "Bewaren mislukt, niet erg"
